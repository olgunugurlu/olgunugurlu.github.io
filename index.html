<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olgun Uğurlu | Bilişim Teknolojileri</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    .header .subtitle {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 500;
    }
    .bio {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .section-title {
      font-size: 1.1rem;
      margin: 20px 0 12px;
      color: var(--text);
    }
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .link-card {
      display: block;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
    }
    .link-card:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Olgun Uğurlu</h1>
      <div class="subtitle">Bilişim Teknolojileri Öğretmeni & Geliştirici</div>
    </header>

    <div class="bio">
      Yazılım geliştirme, yapay zeka entegrasyonları, gömülü sistemler ve veri otomasyonu üzerine çalışmalar yürütüyorum.
    </div>

    <div class="section-title">Çalışma Alanları</div>
    <div class="tags">
      <span class="tag">Python</span>
      <span class="tag">Yapay Zeka & Veri</span>
      <span class="tag">Gömülü Sistemler</span>
      <span class="tag">Otomasyon</span>
    </div>

    <div class="section-title">Bağlantılar</div>
    <div class="links-grid">
      <a href="https://github.com/olgunugurlu" target="_blank" class="link-card">GitHub</a>
      <a href="#" class="link-card">Projeler</a>
      <a href="#" class="link-card">İletişim</a>
    </div>
  </div>

</body>
</html>
